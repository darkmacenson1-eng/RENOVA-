<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RÉNOVA | Quiz</title>
    <style>
        :root {
            --bleu-nuit: #0B1026;
            --violet: #6C3B91;
            --or: #D4AF37;
            --blanc-casse: #F5F5FA;
            --overlay-card: rgba(108, 59, 145, 0.15);
            --border-card: rgba(212, 175, 55, 0.25);
            --font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bleu-nuit);
            color: var(--blanc-casse);
            font-family: var(--font-family);
            line-height: 1.6;
            padding: 2rem 5%;
            max-width: 900px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-card);
            padding-bottom: 1rem;
            margin-bottom: 2rem;
        }
        .logo { font-size: 1.4rem; font-weight: 800; letter-spacing: 2px; color: var(--or); }
        .back-btn {
            background: transparent; border: 1px solid var(--or); color: var(--or);
            padding: 0.5rem 1rem; border-radius: 20px; cursor: pointer; font-weight: 600;
            transition: all 0.3s ease; text-decoration: none;
        }
        .back-btn:hover { background-color: var(--or); color: var(--bleu-nuit); }
        h1 { color: #FFFFFF; font-size: 2rem; margin-bottom: 1.5rem; text-align: center; }
        .content-card {
            background: var(--overlay-card);
            border: 1px solid var(--border-card);
            border-radius: 12px;
            padding: 2rem;
            text-align: center;
        }
        p { color: rgba(245, 245, 250, 0.9); margin-bottom: 1.5rem; }
        .btn-quiz {
            display: inline-block; background-color: var(--or); color: var(--bleu-nuit);
            padding: 0.8rem 2rem; border-radius: 30px; font-weight: 600; text-decoration: none;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3); transition: transform 0.3s ease;
        }
        .btn-quiz:hover { transform: translateY(-2px); }
    </style>
</head>
<body>
    <header>
        <div class="logo">RÉNOVA</div>
        <a href="index.html" class="back-btn">← Retour à l'accueil</a>
    </header>
    <main>
        <h1>RÉNOVA Quiz</h1>
        <div class="content-card">
            <h3>Défie ton esprit et gagne des emblèmes</h3>
            <p>Teste tes connaissances, réponds aux questions thématiques et gravis les échelons du classement pour décrocher le titre suprême !</p>
            <a href="classement.html" class="btn-quiz">Voir le Classement des Génies</a>
        </div>
    </main>
</body>
</html>
