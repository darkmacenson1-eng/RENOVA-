<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RÉNOVA | Profil</title>
    <style>
        :root {
            --bleu-nuit: #0B1026;
            --violet: #6C3B91;
            --or: #D4AF37;
            --blanc-casse: #F5F5FA;
            --overlay-card: rgba(108, 59, 145, 0.15);
            --border-card: rgba(212, 175, 55, 0.25);
            --font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bleu-nuit);
            color: var(--blanc-casse);
            font-family: var(--font-family);
            line-height: 1.6;
            padding: 2rem 5%;
            max-width: 900px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-card);
            padding-bottom: 1rem;
            margin-bottom: 2rem;
        }
        .logo { font-size: 1.4rem; font-weight: 800; letter-spacing: 2px; color: var(--or); }
        .back-btn {
            background: transparent; border: 1px solid var(--or); color: var(--or);
            padding: 0.5rem 1rem; border-radius: 20px; cursor: pointer; font-weight: 600;
            transition: all 0.3s ease; text-decoration: none;
        }
        .back-btn:hover { background-color: var(--or); color: var(--bleu-nuit); }
        h1 { color: #FFFFFF; font-size: 2rem; margin-bottom: 1.5rem; text-align: center; }
        
        .profile-card {
            background: var(--overlay-card);
            border: 1px solid var(--border-card);
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 1.5rem;
            text-align: center;
        }
        .profile-avatar {
            width: 80px;
            height: 80px;
            background: var(--violet);
            border: 2px solid var(--or);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin: 0 auto 1rem;
        }
        .profile-name {
            font-size: 1.4rem;
            font-weight: 700;
            color: #FFFFFF;
            margin-bottom: 0.5rem;
        }
        .profile-role {
            color: var(--or);
            font-weight: 600;
            margin-bottom: 1.5rem;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-top: 1.5rem;
        }
        .stat-box {
            background: rgba(11, 16, 38, 0.6);
            border: 1px solid var(--border-card);
            padding: 1rem;
            border-radius: 8px;
        }
        .stat-value {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--or);
        }
        .stat-label {
            font-size: 0.9rem;
            color: rgba(245, 245, 250, 0.8);
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">RÉNOVA</div>
        <a href="index.html" class="back-btn">← Retour à l'accueil</a>
    </header>
    
    <main>
        <h1>Mon Profil RÉNOVA</h1>
        
        <div class="profile-card">
            <div class="profile-avatar">👑</div>
            <div class="profile-name">Créateur & Visiteur</div>
            <div class="profile-role">Statut : Explorateur de projets</div>
            <p>Bienvenue dans ton espace personnel. Suis ton parcours, observe tes réussites aux quiz et continue de faire progresser tes idées.</p>
            
            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-value">Actif</div>
                    <div class="stat-label">État du compte</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value">Prêt</div>
                    <div class="stat-label">Projets en cours</div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
