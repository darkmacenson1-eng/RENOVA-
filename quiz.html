<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RÉNOVA | Quiz Dynamique</title>
    <style>
        :root {
            --bleu-nuit: #0B1026;
            --violet: #6C3B91;
            --or: #D4AF37;
            --blanc-casse: #F5F5FA;
            --overlay-card: rgba(108, 59, 145, 0.15);
            --border-card: rgba(212, 175, 55, 0.25);
            --font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bleu-nuit);
            color: var(--blanc-casse);
            font-family: var(--font-family);
            line-height: 1.6;
            padding: 2rem 5%;
            max-width: 900px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-card);
            padding-bottom: 1rem;
            margin-bottom: 2rem;
        }
        .logo { font-size: 1.4rem; font-weight: 800; letter-spacing: 2px; color: var(--or); }
        .back-btn {
            background: transparent; border: 1px solid var(--or); color: var(--or);
            padding: 0.5rem 1rem; border-radius: 20px; cursor: pointer; font-weight: 600;
            transition: all 0.3s ease; text-decoration: none;
        }
        .back-btn:hover { background-color: var(--or); color: var(--bleu-nuit); }
        h1 { color: #FFFFFF; font-size: 2rem; margin-bottom: 1.5rem; text-align: center; }
        
        .quiz-container {
            background: var(--overlay-card);
            border: 1px solid var(--border-card);
            border-radius: 12px;
            padding: 2.5rem;
            margin-bottom: 2rem;
        }
        .question-title {
            font-size: 1.2rem;
            color: var(--or);
            margin-bottom: 1.5rem;
            font-weight: 600;
        }
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .option-btn {
            background: rgba(11, 16, 38, 0.8);
            border: 1px solid var(--border-card);
            color: var(--blanc-casse);
            padding: 1rem;
            border-radius: 8px;
            text-align: left;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        .option-btn:hover {
            border-color: var(--or);
            background: rgba(108, 59, 145, 0.3);
        }
        .btn-action {
            display: inline-block; background-color: var(--or); color: var(--bleu-nuit);
            padding: 0.8rem 2rem; border-radius: 30px; font-weight: 600; border: none;
            cursor: pointer; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3); transition: transform 0.3s ease;
        }
        .btn-action:hover { transform: translateY(-2px); }
        .result-box {
            text-align: center;
            display: none;
        }
        .result-box h3 { font-size: 1.5rem; color: var(--or); margin-bottom: 1rem; }
        .links-bottom {
            text-align: center;
            margin-top: 2rem;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">RÉNOVA</div>
        <a href="index.html" class="back-btn">← Retour à l'accueil</a>
    </header>

    <main>
        <h1>Générateur de Quiz RÉNOVA</h1>
        
        <div class="quiz-container" id="quiz-box">
            <div id="question-container">
                <div class="question-title" id="question-text">Chargement des questions...</div>
                <div class="options-list" id="options-container"></div>
            </div>
            
            <div class="result-box" id="result-container">
                <h3>Quiz Terminé ! 🎉</h3>
                <p id="score-text" style="font-size: 1.1rem; margin-bottom: 1rem;"></p>
                <p id="badge-earned" style="font-weight: 700; color: var(--or); font-size: 1.2rem; margin-bottom: 1.5rem;"></p>
                <button class="btn-action" onclick="startQuiz()">Recommencer (Nouvelles questions)</button>
            </div>
        </div>

        <div class="links-bottom">
            <a href="classement.html" class="back-btn" style="display: inline-block;">Voir le Classement des Génies →</a>
        </div>
    </main>

    <script>
        // Une grande banque de questions. Le script en choisira aléatoirement à chaque partie !
        const questionBank = [
            {
                question: "Quelle est la devise principale de RÉNOVA ?",
                options: ["La réussite appartient à ceux qui ont de l'argent.", "Une idée peut être le début d'un nouveau départ.", "Il faut attendre d'avoir tout pour commencer."],
                correct: 1
            },
            {
                question: "Que représente la couleur Bleu Nuit (#0B1026) dans RÉNOVA ?",
                options: ["La vitesse et le divertissement.", "La profondeur, la réflexion et le sérieux.", "Le hasard et la chance."],
                correct: 1
            },
            {
                question: "Quelle attitude RÉNOVA encourage-t-il face au manque de ressources ?",
                options: ["Abandonner immédiatement.", "Commencer avec ce qu'on possède et avancer pas à pas.", "Demander l'impossible aux autres."],
                correct: 1
            },
            {
                question: "Quel emblème couronne l'excellence absolue sur RÉNOVA ?",
                options: ["Génie", "Mage", "Roi"],
                correct: 2
            },
            {
                question: "Quel est l'objectif premier de la section 'CRÉER' ?",
                options: ["Attendre des opportunités magiques.", "Transformer les idées en projets concrets avec les moyens du bord.", "Acheter du matériel coûteux."],
                correct: 1
            },
            {
                question: "Que symbolise la couleur Or (#D4AF37) dans le design de RÉNOVA ?",
                options: ["La simplicité et le repos.", "L'ambition, l'excellence et la réussite progressive.", "Le secret et le mystère."],
                correct: 1
            },
            {
                question: "Quel type de parcours RÉNOVA propose-t-il aux jeunes ?",
                options: ["Un parcours rapide sans effort.", "Un espace de découverte, de création et de progression personnelle.", "Un réseau social de divertissement."],
                correct: 1
            }
        ];

        let activeQuestions = [];
        let currentQuestion = 0;
        let score = 0;

        const questionText = document.getElementById("question-text");
        const optionsContainer = document.getElementById("options-container");
        const questionContainer = document.getElementById("question-container");
        const resultContainer = document.getElementById("result-container");
        const scoreText = document.getElementById("score-text");
        const badgeEarned = document.getElementById("badge-earned");

        function startQuiz() {
            // Mélanger la banque de questions et en prendre 3 au hasard à chaque partie
            let shuffled = [...questionBank].sort(() => 0.5 - Math.random());
            activeQuestions = shuffled.slice(0, 3); // Le quiz affichera 3 questions aléatoires à chaque fois
            
            currentQuestion = 0;
            score = 0;
            resultContainer.style.display = "none";
            questionContainer.style.display = "block";
            loadQuestion();
        }

        function loadQuestion() {
            resetState();
            let q = activeQuestions[currentQuestion];
            questionText.innerText = `Question ${currentQuestion + 1} / ${activeQuestions.length} : ` + q.question;

            q.options.forEach((option, index) => {
                const button = document.createElement("button");
                button.innerText = option;
                button.classList.add("option-btn");
                button.addEventListener("click", () => selectOption(index));
                optionsContainer.appendChild(button);
            });
        }

        function resetState() {
            optionsContainer.innerHTML = "";
        }

        function selectOption(index) {
            if (index === activeQuestions[currentQuestion].correct) {
                score++;
            }
            currentQuestion++;
            if (currentQuestion < activeQuestions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            questionContainer.style.display = "none";
            resultContainer.style.display = "block";
            scoreText.innerText = `Ton score : ${score} / ${activeQuestions.length}`;

            let badge = "";
            if (score === activeQuestions.length) {
                badge = "👑 Emblème débloqué : ROI / GRAND MAGE !";
            } else if (score >= 2) {
                badge = "⚡ Emblème débloqué : MAÎTRE / MAGE !";
            } else {
                badge = "💡 Emblème débloqué : GÉNIE !";
            }
            badgeEarned.innerText = badge;
        }

        // Lancer le quiz au chargement de la page
        startQuiz();
    </script>
</body>
</html>
